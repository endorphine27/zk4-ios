name: Personal macOS Web app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-web:
    name: CINEBOX Web (macOS arm64, unsigned)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: desktop-web

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: desktop-web
        run: npm install --no-audit --no-fund

      - name: Build app icon
        working-directory: desktop-web
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Package app
        working-directory: desktop-web
        run: |
          npx @electron/packager . "CINEBOX Web" \
            --platform=darwin --arch=arm64 --out=out --overwrite \
            --icon=icon.icns --app-bundle-id=ro.cinebox.web \
            --ignore='^/(out|icon\.iconset|node_modules/\.cache)'
          ls out

      # No Developer ID: ad-hoc signature so the app starts on Apple Silicon.
      - name: Ad-hoc sign
        working-directory: desktop-web
        run: |
          app="out/CINEBOX Web-darwin-arm64/CINEBOX Web.app"
          codesign --force --deep -s - "$app"
          codesign --verify --deep "$app" && echo signed

      - name: Zip and DMG
        working-directory: desktop-web
        run: |
          app="out/CINEBOX Web-darwin-arm64/CINEBOX Web.app"
          ditto -c -k --keepParent "$app" "CINEBOX-Web-macOS-arm64.zip"
          mkdir dmgroot && cp -R "$app" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "CINEBOX Web" -srcfolder dmgroot -ov -format UDZO "CINEBOX-Web-macOS-arm64.dmg"
          ls -lh *.zip *.dmg

      - name: Publish release
        working-directory: desktop-web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="webapp-0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" CINEBOX-Web-macOS-arm64.dmg CINEBOX-Web-macOS-arm64.zip \
            --title "CINEBOX Web ${GITHUB_RUN_NUMBER} (macOS arm64)" --prerelease \
            --notes "Prototip CINEBOX Web pentru Mac. Prima pornire: clic dreapta pe aplicație, Deschide."
